services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passe
      POSTGRES_PASSWORD: passe
      POSTGRES_DB: passe
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passe -d passe"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Diferencial: `docker compose up -d --build` sobe também a API e a interface.
  # `docker compose up -d db` continua subindo só o banco (caminho principal do README).
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://passe:passe@db:5432/passe?schema=public
      PORT: "3000"
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:
